<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Counselor of Aksum</title>
  <meta name="description" content="A learning game for Chapter 9: advise the throne of Aksum as Christianity arrives, takes hold, and is tested.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/righteous-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the game</a>
  <header class="site-header">
    <a class="brand" href="#/start">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">The Counselor of Aksum</span>
    </a>
    <div class="site-status" id="status"></div>
  </header>
  <nav class="rail" id="rail" aria-label="Your progress"></nav>
  <main id="main" tabindex="-1">
    <noscript>
      <section class="card notice">
        <h1>This game needs JavaScript</h1>
        <p>Turn on JavaScript in your browser to play. Section 9.6 of Chapter 9 is the reading the game is built on.</p>
      </section>
    </noscript>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="announcer" aria-live="polite"></div>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
